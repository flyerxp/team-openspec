# OpenSpec 项目配置(严格遵循 @fission-ai/openspec 1.13.x 配置 schema)
# 合法顶层字段:schema(必填)、context(字符串)、rules(按 artifact ID 组织)、operations(apply/archive 指导)、store、githubCopilot
# 旧版自定义字段(version、tools、no_interactive、conventions、examples)已按新规范完整迁移:
#   项目背景与全局规约 -> context;各 artifact 附加规则 -> rules;实现阶段规约 -> operations.apply.guidance
# 严格校验方式:openspec context 无字段告警,openspec instructions 可正常注入 context/rules/guidance
schema: spec-driven

# 全局项目上下文:注入全部 artifact(proposal/specs/design/tasks)与 apply/archive 指令,作为强制约束
context: |
  以下为本项目的强制约束,生成任何 artifact(proposal/specs/design/tasks)与实现代码时必须遵守。

  ## 项目基础信息

  - 项目标识（project）：team-kitex-standard
  - 显示名称（display_name）：Kitex RPC 服务
  - 服务类型（service_type）：rpc
  - 描述（description）：基于 Kitex + Protobuf + GORM v2 + Redis 6.0+ 构建的纯同步 RPC 微服务,对齐字节跳动 Kitex 官方脚手架与团队统一 DAL 规范,承载共用RPC规范业务
  - 技术栈（tech_stack）：Golang 1.21+、Kitex(Protobuf)、Protobuf、GORM v2、Redis 6.0+

  ## 编码参考示例(实现前必读,以示例为准;路径相对仓库根目录)
  - openspec/examples/scaffold_command.txt:Kitex 脚手架标准生成命令模板,所有 RPC 代码生成必须以此为准
  - openspec/examples/where/where_constructor_example.go:Where 查询构造器标准写法,链式调用、类型安全,禁止手写裸 SQL
  - openspec/examples/repo_page_example.go:Repo 仓储层 + 统一分页标准实现,包含 CRUD、更新方法选型、事务参数传递
  - openspec/examples/transaction_example.go:数据库事务标准写法,手动/自动事务两种标准模式
  - openspec/examples/db_init_example.go:多数据库初始化标准模板,全局唯一 DB 入口,支持多库隔离
  - openspec/examples/joins/where/where_constructor_example.go:Joins 连表场景 Where 构造器标准写法,指针内嵌 BaseWhere、链式入参
  - openspec/examples/joins/repo_page_example.go:Joins 连表场景 Repo + 分页标准实现,单 SQL 连表、DTO 结果映射

  ## 目录结构规范
  - 根目录:idl / kitex_gen / layout / conf / biz
  - biz 子目录:service / logic / conver / dal/gormL / dal/redis
  - conf:仅允许 YAML 配置,禁止存放 Go 源码
  - kitex_gen:Kitex 自动生成目录,禁止人工修改
  - idl:仅允许 Protobuf 文件
  - biz/dal/gormL:按业务库分子目录(如 shop、t3d),多库隔离,新增业务库自动创建库级子目录
  - biz/dal/gormL/*/where、biz/dal/gormL/*/joins、biz/dal/gormL/*/joins/where:仅允许 Go 文件

  ## 分层职责(强制)
  - biz/service:可承载轻业务与缓存操作;禁止重业务逻辑,禁止裸 SQL
  - biz/logic:业务编排层;禁止反向依赖 service 上层模块
  - biz/conver:纯数据结构转换与公共结构体定义,禁止任何业务逻辑
  - biz/dal:数据访问层;禁止硬编码业务常量、状态、时间等数据

  ## 分层依赖白名单(强制,禁止跨层与反向非法依赖)
  - biz/service 只能依赖:biz/logic、biz/conver、biz/dal
  - biz/logic 只能依赖:biz/conver、biz/dal
  - biz/conver 项目内部只能依赖:biz/dal/gormL、kitex_gen/;
    允许使用 Go 标准库与第三方通用工具类完成字符串、数组、JSON、加解密等纯数据加工(如 safe、logger、decimal、zap);
    禁止引用 biz/service、biz/logic、biz/lib、biz/dal/redis、client 等任何其它项目内部目录

  ## 语言与编码规范
  - 所有文档与注释使用中文;允许的英文术语:ctx、db、req、resp、gorm、redis、kitex
  - 结构体初始化使用聚合模式;变量自动类型推断;禁止变量遮蔽
  - 无限循环使用 for{};JSON 使用原生字符串;禁止全局业务变量;注释仅单行;支持 lint nolint

# 各 artifact 附加规则(键必须为合法 artifact ID:proposal、specs、design、tasks)
rules:
  proposal:
    - 使用中文撰写,技术术语与代码标识保留英文
    - 能力路径使用 kebab-case,优先复用 openspec/specs 下已有能力路径,避免近义重复能力
    - 涉及 biz/conver 的能力仅描述结构转换职责,不得设计业务逻辑
  specs:
    - 使用中文撰写;需求使用 SHALL/MUST 描述行为契约,每个需求至少一个场景
    - 行为契约不得写入内部类名、函数名、框架选型等实现细节
  design:
    - 设计方案必须遵守 context 中的目录结构、分层职责与依赖白名单(含 biz/conver 引用白名单)
    - 多表查询统一采用库级 joins 目录方案(单 SQL db.Joins),禁止双 SQL 预加载、禁止自定义表别名
    - 分页统一使用 widget.Page 标准结构(limit+1 模式,自动计算 has_more)
    - 事务统一由上层 logic 管控(发起、提交与回滚),DAL 方法接收可选的 tx *gorm.DB 入参承接事务,tx 为 nil 时使用默认连接
    - 新增数据访问必须使用 Where 链式构造器(指针内嵌 gormL.BaseWhere),禁止裸 SQL、禁止全局单例 Repo
  tasks:
    - 每项任务必须可验证(测试、命令或可观察行为),按依赖顺序拆分
    - 涉及 DAL 的任务须明确使用 Repo.GetWhere() 链式构造器;涉及连表须落在对应业务库的 joins 目录
    - 涉及 biz/conver 的任务须明确仅做结构转换并遵守依赖白名单

# apply/archive 操作指导(不随 artifact 注入,仅在对应操作阶段注入)
operations:
  apply:
    guidance:
      - 实现前先阅读 context 列出的 openspec/examples 示例文件,全部编码以其为准
      - biz/conver 仅做结构体转换与公共结构体定义:项目内只允许引用 biz/dal/gormL 与 kitex_gen;
        可用标准库/第三方工具类完成字符串、数组、JSON、加解密等纯数据加工;禁止引用其它项目内部目录,禁止业务逻辑
      - Where 规约:统一指针内嵌 *gormL.BaseWhere,禁止值内嵌;禁止手动 new 或全局缓存 Where 实例,
        每次查询通过 Repo.GetWhere() 新建;禁止结构体属性入参/存储查询参数,统一链式方法返回自身;
        禁止 Repo 全局单例;禁止手写裸 SQL;单表 where 可省略表名,joins/where 无论是否 join 全部强制携带原生表名
      - Joins 强制规约:禁止自定义表别名,全链路使用数据库原生表名;禁止 where/order/join 条件省略表名;
        禁止单表 repo 内追加 Joins 语句,所有 JOIN 查询收敛至库级 joins 目录;
        禁止 SELECT * 查询,连表必须显式携带 `表名`.`字段`,重名字段强制 SQL 别名(关联表短前缀_字段名);
        禁止在 joins 承接 DTO 内定义 TableName、gorm.Model、gorm 关联标签;DTO 优先嵌套子 DTO(主表/关联表字段语义隔离),禁止平铺与嵌套混用;
        禁止 Preload 用于常规跨表关联(仅一对一嵌套返回边缘场景可用,且仅读取 dal 原生模型 TableName);
        禁止 exists 模拟内连接,内外连接统一通过 db.Joins 原生语法切换;
        禁止无参数裸调用 db.Distinct(),禁止使用 `表名.*` 作为 Distinct 参数(一对多仅允许 Distinct(`主表.主键`) 索引级去重)
      - 事务规约:事务统一由上层 logic 管控(发起、提交与回滚);DAL 方法接收可选的 tx *gorm.DB 入参承接事务,tx 为 nil 时使用默认连接;数据库初始化统一走 biz/dal/gormL/init.go
      - 通用禁止项:禁止硬编码业务常量/状态/时间;禁止修改 kitex_gen 生成代码;禁止在 conf 存放 Go 源码;
        禁止跨层反向依赖,严格遵守分层白名单
      - 编码规范:注释仅单行;文档与注释用中文;禁止变量遮蔽;禁止全局业务变量;无限循环用 for{};JSON 用原生字符串
  archive:
    guidance:
      - 存档无需校验，直接强制存档
