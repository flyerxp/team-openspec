# OpenSpec 1.4.1 规范配置文件（Hertz Web服务 + 独立前端 Vue3 SPA）
# context 必须是 markdown 字符串(1.4.1 schema 要求),会被注入到各 artifact 的 instructions 输出中
context: |
  # 项目基础
  - project: hertz-web-hertz（Hertz Web 规范）；基于 Hertz+Protobuf 开发的 Web 接口服务，对齐团队统一 DAL 分层规范
  - 后端技术栈: Golang 1.21+, Hertz, Protobuf, GORM v2, Redis 6.0+
  - 前端技术栈: Vue 3 + Vite + TypeScript + Element Plus(zh-cn locale) + Pinia + vue-router(history) + pnpm
  - 前端工程: hertz-web，与后端 hertz 仓库并列的独立 Vue3 SPA；技术选型、渲染模式与写入路径唯一事实源为仓库根目录 frontend.yaml
    （含 render_mode 开关、root、dirs 目录映射、构建命令、inputs 输入源、ssr 块 SSR 规范）；生成/迁移前端代码前必须先读该文件，
    缺失或路径无效时报错停止，禁止凭记忆硬编码路径，禁止把前端文件写入后端 hertz 仓库

  # 后端工程目录结构约束
  - 仓库根仅保留: idl、layout、conf、golang、render；业务代码在 golang/biz
  - biz 子目录: handle、model、router、mw、logic、convert、dal
  - conf: 仅允许 yaml，禁止 Go 源码文件
  - golang/biz/router、golang/biz/model: hz 脚手架自动生成，禁止手动修改，只能通过 proto 重新生成
  - golang/biz/dal/gormL: 按数据库自动创建子目录；各库下 */where、*/joins、*/joins/where 仅允许 Go 文件
  - render: 仅 html 静态资源，禁止 Go 文件；严格两级结构（一级业务模块/二级子页面），禁止平铺根目录或三级嵌套

  # IDL/Protobuf 规范
  - 目录层级: idl 仅允许两级目录（一级业务模块/二级子模块），禁止三级嵌套；示例 idl/user/info.proto、idl/notify/push.proto
  - Service 命名: 以 idl 一级业务目录名作为 Service 前缀，格式【业务名+Service】；同目录所有 proto 共用唯一 Service，
    单文件仅 1 个 service，禁止私自改名或多 Service 并存（如 idl/notify/ 全部统一 service NotifyService）
  - 文件命名: snake_case + .proto 后缀，禁止大驼峰/中文/空格/特殊符号；示例 notify_push.proto
  - package: 与一级业务目录名一致，无版本后缀；文件头强制模板: syntax="proto3"; package 业务目录名; option go_package="业务目录名"
  - message: UpperCamelCase，请求/响应后缀 Request/Response；enum: UpperCamelCase，值 UPPER_SNAKE_CASE，首常量 UNKNOWN=0
  - 字段: snake_case，field id 从 1 连续编号，禁止跳号、禁止删除已发布字段 id
  - 校验注解: 需要合法性校验的字段必须加 (api.vd)，格式"校验表达式;msg:按业务场景自定义的错误提示"，禁止统一笼统"参数错误"；
    常用: 数字ID "$ > 0"、非负 "$ >= 0"、字符串非空 "len($) > 0"、长度 "len($) <= 64"
  - rpc: UpperCamelCase，仅 unary，单 req/resp，必须挂 Hertz http annotation（api.get/post 等路由注解）
  - 禁止: proto2 语法；message/enum/rpc/字段缺中文注释；循环 import；顶层 message map 嵌套复杂结构体

  # Go 全局编码规范
  - 注释仅单行；文档与注释用中文；JSON 用原生字符串
  - 字符串用反引号；无限循环用 for{}；结构体用聚合初始化；自动类型推断；禁止变量遮蔽；禁止全局业务变量；lint 可 nolint

  # 分层职责与依赖白名单
  - handle 可依赖: logic、convert、dal；logic 可依赖: convert、dal；convert 与 dal 不依赖上层
  - handle: 允许轻量业务与缓存优化，禁止重型可复用业务逻辑（必须下沉 logic），禁止裸 SQL
  - logic: 禁止反向依赖 handle 上层，禁止循环依赖；事务统一由 logic 管控（发起、提交、回滚）
  - convert: 仅做结构体转换与公共结构体定义，禁止任何业务判断/数据处理/流程逻辑；
    项目内只允许引用 biz/dal/gormL 与 kitex_gen，可用标准库/第三方工具类做纯数据加工，禁止引用其它项目内部目录

  # DAL 层强制规范
  - 多库隔离模式，数据库初始化统一走 biz/dal/gormL/init.go，全局唯一 DB 入口
  - Where: 统一指针内嵌 *gormL.BaseWhere，禁止值内嵌；禁止手动 new 或全局缓存 Where 实例，每次查询经 Repo.GetWhere() 新建；
    禁止结构体属性入参/存储查询参数，统一链式方法返回自身；禁止手写裸 SQL；
    单表 where 可省略表名，joins/where 无论是否 join 全部强制携带原生表名
  - Repo: 禁止全局单例，每次使用新建实例；必须实现 GetWhere
  - 分页: 统一 widget.Page 标准结构，limit+1 模式，自动计算 has_more
  - Joins 强制规约: 禁止自定义表别名，全链路使用数据库原生表名；禁止 where/order/join 条件省略表名；
    禁止单表 repo 内追加 Joins 语句，所有 JOIN 查询收敛至库级 joins 目录（单 SQL db.Joins，禁止双 SQL 预加载）；
    禁止 SELECT *，连表必须显式 `表名`.`字段`，重名字段强制别名（关联表短前缀_字段名，如 price.id => price_id）；
    禁止在 joins 承接 DTO 内定义 TableName、gorm.Model、gorm 关联标签；
    DTO 优先嵌套子 DTO（主表/关联表语义隔离），简单查询可平铺，禁止两种风格混用；
    禁止 Preload 用于常规跨表关联（仅一对一嵌套返回边缘场景，且只读 dal 原生模型 TableName，禁止一对多/分页/内外连接场景）；
    禁止 exists 模拟内连接，内外连接统一 db.Joins 原生语法切换；
    禁止无参裸 db.Distinct()、禁止 `表名.*` 作 Distinct 参数（一对多仅允许 Distinct(`主表.主键`) 索引级去重）
  - 事务: DAL 方法接收可选 tx *gorm.DB 入参承接事务，tx 为 nil 时用默认连接；事务管控在 logic 层
  - 禁止硬编码业务常量、状态、时间、ID 等固定数据；禁止手动修改 kitex_gen 生成代码

  # 脚手架生成规范
  - hz 从 proto 生成 router/model；禁止手写 router、model；接口变更只通过改 proto 重新生成

  # 关联代码示例（实现前必读，全部编码以其为准）
  - openspec/examples/where/where_constructor_example.go: Where 链式查询构造器标准写法，类型安全禁止裸 SQL
  - openspec/examples/repo_page_example.go: Repo 仓储层+统一分页完整实现，含 CRUD、更新方法选型
  - openspec/examples/transaction_example.go: GORM 两种事务标准写法（手动/自动）
  - openspec/examples/db_init_example.go: 多数据库统一初始化 init.go 模板，全局唯一 DB 入口
  - openspec/examples/hz_scaffold_command.txt: Hertz Protobuf 脚手架标准生成命令模板
  - openspec/examples/joins/where/where_constructor_example.go: Joins 连表场景 Where 写法（指针内嵌 BaseWhere，链式入参）
  - openspec/examples/joins/repo_page_example.go: Joins 连表 Repo+分页（Preload 连表查询、DTO 结果映射）

  # 前端输入读取规则（生成前端代码前按序读取）
  - 接口契约（参数名/校验）以 golang/idl/<module>/<module>.proto 为准：form/path/query/json tag 与 (api.vd)
    决定提交键名与前端校验；禁止用 Go 字段名（snake_case 转下划线）代替 tag 声明的实际参数名
  - 响应结构以 golang/biz/handler/<module>/<module>_service.go 的渲染 map/结构体为准：
    项目内 Go map 字面量键为 snake_case，外部 kitex 结构体（如 *user.UserJson、*RefundApply）键为其 Go 字段名 PascalCase，
    取值一律用 src/utils/pick.ts 的 pick(row,key)
  - 页面与接口路径以 golang/biz/router/<module>/<module>.go 注册清单为准，禁止凭空拟定路由
  - 迁移页面必读对应老模板 render/html/<module>/<sub>/*.html 与 static/web/js/<module>.js：
    按钮、弹窗、列、跳转、确认框、下载链接等功能元素必须在新页面有等价实现
  - 复用既有前端资产：先查 src/api/<module>/ 是否已有同接口封装、src/router/index.ts viewMap 是否已有条目、
    src/components(DataTable/Pager) 与 src/utils(fmtDateTime/parsePageString/toForm/uploadImg) 是否可复用，再动手新增

  # 前端输出写入规则（写到哪）
  - API 封装写 <frontend.root>/src/api/<后端一级路径>/<一级或二级模块>.ts；共享基础设施（request.ts/types.ts/auth.ts）
    留在 src/api 根，不参与分组
  - 页面写 <frontend.root>/src/views/<一级>/<二级>/{List,Edit,View}.vue；列表 List、编辑 Edit、详情 View，
    独立结果页用 Result.vue 命名避免被路由自动加载；弹窗组件用 Step*.vue 等前缀且不得加入 viewMap
  - 新增页面必须同步两处: src/router/index.ts 的 viewMap 条目 + Layout 侧边栏菜单（结构对齐老后台 left.html）；
    由 router 自动前缀生成的路径无需手工注册（/#/ 与无 hash 两套）
  - 新增 API 一级前缀必须同步追加 vite.config.ts 的 API_PREFIXES 数组（proxy 改动不热更新，需重启 pnpm dev）
  - 禁止在 frontend.yaml dirs 之外新增前端目录层级
  - 渲染模式分派: render_mode=spa(默认)按上述 SPA 落点执行；render_mode=ssr 时整体改用 frontend.ssr 块——写入根目录换成 ssr.root(Nuxt 3 工程)，
    页面落点换成 ssr.dirs(pages 文件路由/composables/api/middleware/layouts 等，禁止再维护 viewMap)，构建验证换成 nuxt build/typecheck，
    开发代理改追加 nuxt.config.ts#nitro.devProxy；两套模式目录落点互斥禁止混用；SSR 模式仍遵守同一套 inputs 输入顺序与编码强约束，
    并遵守 ssr.rules(服务端无 JWT 登录态、useAsyncData 同构取数、import.meta.client 包裹浏览器 API、外链老页保持整页跳转、默认 robots noindex、禁止为 SSR 改 Go 后端)

  # 前端架构事实与编码强约束
  - 认证: JWT 存 localStorage；401/未登录跳 /login；登录成功 fetchUserInfo + registerDynamicRoutes 全量注册 viewMap
  - 响应信封: 后端统一 {status,message,data}，status=0 成功；前端 request.ts 拦截器统一处理，status≠0 展示 message；
    Go 侧 RenderSuccessHtml 按请求类型判别（XHR 返回 JSON、页面导航返回老 HTML），跨域外链老页面依赖此机制
  - 表单提交用 postForm(toForm 序列化)：数组参数展开为同名多值（对齐 jQuery traditional:false），
    普通 query 用 ?k=v 字符串，禁止 axios params 传对象
  - 后端字典统一 {Id,SE,TE}：下拉 value=Id、label=TE；枚举/状态回填优先匹配 SE/TE 文案，兜底用 Id，禁止按列表位置猜测赋值
  - 字典类筛选/表单下拉首项必须为「请选择XX」，选中该项等价于不过滤（值为 0 时不序列化该参数）；不限时间日期项不算此类
  - 日期控件统一 el-date-picker 并全局 zh-cn locale 中文显示，禁止新增原生 input[type=date]
  - 列表列名/标题/参数名逐字对齐老页面；时间列按数据字段实际语义展示，老模板表头与数据错位的以数据为准修正
  - 权限敏感入口用 v-perm 指令控制（值取 handler 下发的 *Qx 字段）；el-pagination 用 prev/next 模式
  - 禁止为配合前端修改 Go 后端代码（新增接口、改渲染键名）；后端现状即契约，新端点视为独立变更

  # 全局红线禁止清单
  - 禁止 logic 层反向依赖 handle 上层模块，禁止循环依赖
  - 禁止 convert 层编写任何业务判断、数据处理、流程逻辑
  - 禁止 handle 层编写可复用重型通用业务逻辑，必须下沉 logic
  - 禁止手动 new 实例化 Where 结构体，必须通过 Repo.GetWhere() 获取
  - 禁止手写裸 SQL，全部使用 where 链式构造器查询
  - 禁止 Repo 全局单例，每次使用必须新建实例
  - 禁止 conf 目录存放 Go 源码文件，仅允许 yaml 配置
  - 禁止手动修改 router、model 脚手架自动生成代码
  - 禁止业务硬编码常量、状态、时间、ID 等固定数据
  - 禁止 render 目录层级混乱，必须严格两级：一级业务模块/二级子页面

# 各 artifact 附加规则(键必须为合法 artifact ID:proposal、specs、design、tasks)
rules:
  proposal:
    - 使用中文撰写,技术术语与代码标识保留英文
    - 能力路径使用 kebab-case,优先复用 openspec/specs 下已有能力路径,避免近义重复能力
    - 涉及 biz/conver 的能力仅描述结构转换职责,不得设计业务逻辑
    - 涉及前端页面迁移/新增时,必须列出受影响的 API 文件、views 页面清单与 viewMap 路由条目数,并声明写入路径以根目录 frontend.yaml 为准
  specs:
    - 使用中文撰写;需求使用 SHALL/MUST 描述行为契约,每个需求至少一个场景
    - 行为契约不得写入内部类名、函数名、框架选型等实现细节
  design:
    - 设计方案必须遵守 context 中的目录结构、分层职责与依赖白名单(含 biz/conver 引用白名单)
    - 多表查询统一采用库级 joins 目录方案(单 SQL db.Joins),禁止双 SQL 预加载、禁止自定义表别名
    - 分页统一使用 widget.Page 标准结构(limit+1 模式,自动计算 has_more)
    - 事务统一由上层 logic 管控(发起、提交与回滚),DAL 方法接收可选的 tx *gorm.DB 入参承接事务,tx 为 nil 时使用默认连接
    - 新增数据访问必须使用 Where 链式构造器(指针内嵌 gormL.BaseWhere),禁止裸 SQL、禁止全局单例 Repo
    - 涉及前端的设计方案:写入路径只能引用 frontend.yaml 声明的目录映射,禁止硬编码绝对路径;必须列出后端契约勘察结论(IDL 参数名、handler 响应键、路由清单)作为设计输入,并遵守 context 中的前端输入读取规则/输出写入规则/编码强约束;默认不改 Go 后端
  tasks:
    - 每项任务必须可验证(测试、命令或可观察行为),按依赖顺序拆分
    - 涉及 DAL 的任务须明确使用 Repo.GetWhere() 链式构造器;涉及连表须落在对应业务库的 joins 目录
    - 涉及 biz/conver 的任务须明确仅做结构转换并遵守依赖白名单
    - 涉及前端页面的任务固定三项验收:vue-tsc 类型检查通过、pnpm build 全绿、与对应老模板逐元素功能比对;API/viewMap/侧边栏菜单/vite API_PREFIXES 的同步修改须列为独立子任务

# apply/archive 操作指导(不随 artifact 注入,仅在对应操作阶段注入)
operations:
  apply:
    guidance:
      - 实现前先阅读 context 列出的 openspec/examples 示例文件,全部编码以其为准
      - biz/conver 仅做结构体转换与公共结构体定义:项目内只允许引用 biz/dal/gormL 与 kitex_gen;
        可用标准库/第三方工具类完成字符串、数组、JSON、加解密等纯数据加工;禁止引用其它项目内部目录,禁止业务逻辑
      - Where 规约:统一指针内嵌 *gormL.BaseWhere,禁止值内嵌;禁止手动 new 或全局缓存 Where 实例,
        每次查询通过 Repo.GetWhere() 新建;禁止结构体属性入参/存储查询参数,统一链式方法返回自身;
        禁止 Repo 全局单例;禁止手写裸 SQL;单表 where 可省略表名,joins/where 无论是否 join 全部强制携带原生表名
      - Joins 强制规约:禁止自定义表别名,全链路使用数据库原生表名;禁止 where/order/join 条件省略表名;
        禁止单表 repo 内追加 Joins 语句,所有 JOIN 查询收敛至库级 joins 目录;
        禁止 SELECT * 查询,连表必须显式携带 `表名`.`字段`,重名字段强制 SQL 别名(关联表短前缀_字段名);
        禁止在 joins 承接 DTO 内定义 TableName、gorm.Model、gorm 关联标签;DTO 优先嵌套子 DTO(主表/关联表字段语义隔离),禁止平铺与嵌套混用;
        禁止 Preload 用于常规跨表关联(仅一对一嵌套返回边缘场景可用,且仅读取 dal 原生模型 TableName);
        禁止 exists 模拟内连接,内外连接统一通过 db.Joins 原生语法切换;
        禁止无参数裸调用 db.Distinct(),禁止使用 `表名.*` 作为 Distinct 参数(一对多仅允许 Distinct(`主表.主键`) 索引级去重)
      - 事务规约:事务统一由上层 logic 管控(发起、提交与回滚);DAL 方法接收可选的 tx *gorm.DB 入参承接事务,tx 为 nil 时使用默认连接;数据库初始化统一走 biz/dal/gormL/init.go
      - 通用禁止项:禁止硬编码业务常量/状态/时间;禁止修改 kitex_gen 生成代码;禁止在 conf 存放 Go 源码;
        禁止跨层反向依赖,严格遵守分层白名单
      - 编码规范:注释仅单行;文档与注释用中文;禁止变量遮蔽;禁止全局业务变量;无限循环用 for{};JSON 用原生字符串
      - 前端实现入口规则:生成/修改任何前端代码前,先读仓库根目录 frontend.yaml:①先读 render_mode 确定渲染模式(spa 默认走顶层 root/dirs/命令;ssr 整体改用 frontend.ssr 块的 root/dirs/命令/规则,两套目录落点互斥禁止混用);
        ②再解析对应模式的工程根目录与目录映射;缺失或路径无效时报错停止,禁止回退默认路径,禁止把前端文件写进后端 hertz 仓库
      - 前端 SSR 模式专项规则(render_mode=ssr 时):页面走 Nuxt 文件路由(pages/<一级>/<二级>/index.vue 等)不再维护 viewMap;首屏数据 useAsyncData/useFetch 同构取数;
        服务端无 JWT 登录态(存 localStorage),SSR 仅登录页/壳直出,登录后页面客户端守卫后取数;浏览器 API 必须 import.meta.client 包裹;Element Plus 用 @element-plus/nuxt;
        外链老页面保持整页跳转;meta 用 useSeoMeta,后台默认 robots noindex;验收 nuxt build+typecheck+curl 验证 HTML 直出;禁止为 SSR 修改 Go 后端(含 cookie 鉴权,需另立独立变更)
      - 前端输入读取顺序:①golang/idl/<module>/*.proto 定参数名与校验(form/path/query/json tag、api.vd);
        ②golang/biz/handler/<module>/ 定响应实际键(项目 map snake_case、外部 kitex 结构体 PascalCase 用 pick 取值);
        ③golang/biz/router/<module>/ 定路径清单;④render/html 老模板与 static/web/js 定功能等价基线;
        ⑤既有 src/api 与 viewMap 先查重复用,再新增
      - 前端输出落点:src/api/<一级>/<模块>.ts、src/views/<一级>/<二级>/{List,Edit,View}.vue、
        src/router/index.ts viewMap、Layout 侧边栏菜单、vite.config.ts API_PREFIXES;
        独立结果页命名 Result.vue 避免路由自动加载,弹窗组件不得进 viewMap
      - 前端强约束:postForm/toForm 数组同名多值;字典 {Id,SE,TE} value=Id label=TE,回填 SE/TE 优先 Id 兜底;
        筛选/表单下拉首项『请选择XX』选中即不过滤;el-date-picker + zh-cn locale;列名逐字对齐老页面,数据列错位以字段语义为准;
        v-perm 控制权限入口;el-pagination 用 prev/next 模式;禁止为配合前端改 Go 后端
      - 前端验收:逐页 vue-tsc --noEmit 与 pnpm build 通过,无头渲染或人工比对老模板功能元素不得缺失
  archive:
    guidance:
      - 存档无需校验，直接强制存档
