# OpenSpec 1.4.1 新版配置文件（Hertz Web服务专属）
version: "1.0"
no_interactive: true

context:
  # 项目基础信息
  project: "hertz-web"
  display_name: "Hertz Protobuf Web服务"
  service_type: ["web"]
  description: "基于Hertz+Protobuf开发的Web接口与Liquid页面渲染服务，对齐团队统一DAL分层规范"
  tech_stack: ["Golang 1.21+", "Hertz", "Protobuf", "GORM v2", "Redis 6.0+", "Liquid"]
  
  # 关联代码示例文件（AI自动读取参考）
  examples:
    - path: "openspec/examples/where/where_constructor_example.go"
      description: "Where链式查询构造器标准写法，类型安全禁止裸SQL"
    - path: "openspec/examples/repo_page_example.go"
      description: "Repo仓储层+统一分页完整实现，包含CRUD、更新方法选型"
    - path: "openspec/examples/transaction_example.go"
      description: "GORM两种事务标准写法，手动/自动事务两种模式"
    - path: "openspec/examples/db_init_example.go"
      description: "多数据库统一初始化init.go模板，全局唯一DB入口"
    - path: "openspec/examples/hz_scaffold_command.txt"
      description: "Hertz Protobuf脚手架标准生成命令模板"
    - path: "openspec/examples/joins/where/where_constructor_example.go"
      description: "Joins连表场景的Where查询构造器标准写法，指针内嵌BaseWhere，链式入参"
    - path: "openspec/examples/joins/repo_page_example.go"
      description: "Joins连表场景的Repo+分页标准实现，Preload连表查询、DTO结果映射"
  # 全局编码规范
  code_rule:
    comment_rule: "single_line"
    string_backtick: true
    infinite_for: true
    struct_aggregate_init: true
    auto_type_infer: true
    forbid_var_shadow: true
    forbid_global_biz_var: true
    lint_nolint_allow: true
  
  # 工程目录结构约束
  dir_struct:
    root_keep:
      - idl
      - layout
      - conf
      - golang
      - render
    biz_path: "golang/biz"
    biz_sub_dir:
      - handle
      - model
      - router
      - mw
      - logic
      - convert
      - dal
  # 目录专属强约束
  dir_rule:
    conf:
      only_yaml: true
      forbid_go_file: true
    idl:
      only_protobuf: true
      # 目录层级约束：idl仅允许两级目录（一级业务模块/二级子模块），禁止三级嵌套
      allow_two_level_dir: true
      forbid_three_level_dir: true
      dir_struct_example: "idl/user/info.proto、idl/order/operate.proto、idl/notify/push.proto；禁止idl/user/info/detail.proto三级嵌套"
      # 按业务目录区分Service命名强制规则
      uniform_service_by_biz_dir: true
      service_name_rule: "以idl一级业务目录名作为Service前缀，格式为【业务名+Service】；同目录下所有.proto文件必须共用同一个Service名称，禁止自定义、修改服务名。示例：idl/notify/全部文件统一 service NotifyService {}，idl/user/全部文件统一 service UserService {}"
      forbid_multi_service_in_same_dir: true
      forbid_multi_service_rule: "同一个一级业务目录下，所有proto只能定义对应唯一业务Service；单个proto文件内也仅允许存在1个service，禁止同目录出现多个不同Service"
      # proto文件命名规范
      file_naming:
        case: snake_case
        suffix: ".proto"
        forbid: 大驼峰、中文、空格、特殊符号文件名
        example: notify_push.proto、user_query.proto、order_create.proto
      # package包名规范（移除v1后缀）
      package_spec:
        format: 业务模块名
        example: package notify; package user; package order;
        note: 每个一级业务目录使用独立package，与目录名保持一致，不带版本后缀
      # 文件头部强制模板（无v1、go_package简化为业务名）
      mandatory_file_header:
        - syntax = "proto3";
        - package 业务目录名;
        - option go_package = "业务目录名";
      # message/枚举/字段命名规范
      message_rule:
        name_case: UpperCamelCase
        req_suffix: Request
        resp_suffix: Response
        example: SendNotifyRequest、GetUserResponse
      enum_rule:
        name_case: UpperCamelCase
        value_case: UPPER_SNAKE_CASE
        first_const: UNKNOWN = 0
      field_rule:
        name_case: snake_case
        field_id_start: 1
        forbid_skip_field_id: true
        forbid_delete_old_field_id: true
        # 新增字段参数校验注解规范
        validate_annotation_spec:
          enable_mandatory: true
          annotation_key: "(api.vd)"
          annotation_format: "校验表达式;msg:自定义错误提示文案"
          example: int32 ShopId = 1 [(api.path) = "shop_id" ,(api.vd) = "$ >= 0 ;msg:sprintf('店铺ID参数错误')"];
          rule_desc: "所有需要合法性校验的字段必须添加(api.vd)校验注解；校验表达式按需自定义（大于0、大于等于0、非空、长度限制等）；错误提示文案根据业务场景自定义，禁止统一笼统提示"
          common_expressions:
            - 数字ID: "$ > 0 ;msg:sprintf('XXID不能为空')"
            - 非负数字: "$ >= 0 ;msg:sprintf('XX参数不能为负数')"
            - 字符串非空: "len($) > 0 ;msg:sprintf('XX不能为空')"
            - 字符串长度范围: "len($) <= 64 ;msg:sprintf('XX长度不能超过64位')"
      # rpc接口规范（Hertz http proto专用）
      rpc_spec:
        name_case: UpperCamelCase
        only_unary: true
        single_req_resp: true
        must_attach_http_annotation: true
      # 禁止行为清单
      forbidden_behavior:
        1. idl创建三级及以上嵌套目录
        2. 同一一级业务目录下proto文件私自修改Service名称，不遵循【业务名+Service】命名规则
        3. 单个proto文件、同目录内出现多个不同service定义
        4. 使用proto2语法，强制统一proto3
        5. message、enum、rpc、字段缺少中文注释
        6. 循环import其他proto文件
        7. 顶层message使用map嵌套复杂结构体
        8. 业务必填、需要合法性判断的字段不添加(api.vd)校验注解
        9. 校验注解msg文案统一复用“参数错误”，不区分业务场景自定义提示
    golang/biz/router:
      manual_edit_forbid: true
    golang/biz/model:
      manual_edit_forbid: true
    # gormL 自动创建多库子目录
    golang/biz/dal/gormL:
      auto_create_sub_db_dir: true
    # 所有库下的 where 目录约束：仅允许Go文件、禁止其他文件
    golang/biz/dal/gormL/*/where:
      only_go_file: true
      forbid_other_file: true
    # 新增：所有业务库下 顶层joins目录约束
    golang/biz/dal/gormL/*/joins:
      only_allow_go: true
      forbid_other_file: true
    # 新增：joins内部子where目录约束，和单表where规则完全对齐
    golang/biz/dal/gormL/*/joins/where:
      only_allow_go: true
      forbid_other_file: true
    render:
      only_html_asset: true
      forbid_go_file: true
      layer_limit: 2
      forbid_flat_root_html: true
      forbid_multi_layer_nest: true
  
  # 分层职责 & 依赖白名单
  layer_rule:
    deps_whitelist:
      golang/biz/handle: ["golang/biz/logic", "golang/biz/convert", "golang/biz/dal"]
      golang/biz/logic: ["golang/biz/convert", "golang/biz/dal"]
      golang/biz/convert: []
      golang/biz/dal: []
    layer_constraint:
      handle_allow_light_biz: true
      handle_allow_cache_opt: true
      handle_forbid_heavy_biz: true
      handle_forbid_raw_sql: true
      logic_forbid_depend_upper: true
      convert_forbid_biz_logic: true
  
  # DAL层强制规范
  dal:
    db_isolate_mode: "multi_db_isolate"
    init_file_path: "biz/dal/gormL/init.go"
    where_constructor:
      enable: true
      base_struct: "gormL.BaseWhere"
      forbid_raw_sql: true
    repo:
      forbid_global_singleton: true
      must_implement_get_where: true
      where_only_from_repo_method: true
    page:
      limit_plus_one_mode: true
      auto_calc_has_more: true
      standard_page_struct: "widget.Page"
    # 修复1：全部移入dal内部，此前层级外飘导致框架无法识别
    join_spec:
      enable: true
      join_dir_relation: "db_level_sibling_with_where"
      joins_sub_dir: ["where"]
      forbidden_rules:
        - 禁止自定义任何表别名，全链路使用数据库原生表名
        - 禁止where、order、join条件省略表名，所有多表关联查询必须携带原生表名
        - 禁止单表repo内追加Joins语句，所有JOIN查询全部收敛至库级joins目录
        - 禁止SELECT * 查询，连表查询必须显式携带【`表名`.`字段`】，重名字段强制SQL别名
        - 禁止在joins承接DTO内定义TableName、gorm.Model、gorm关联标签
        - 禁止Preload用于常规跨表关联，仅允许一对一嵌套返回边缘场景使用
        - Where层禁止结构体属性入参，统一使用链式方法返回自身
        - 禁止exists模拟内连接，内外连接统一通过db.Joins原生语法切换
        - 禁止无参数裸调用 db.Distinct()，禁止使用 `表名.*` 作为Distinct参数
      column_spec:
        syntax: "`table_name`.`column_name`"
        duplicate_alias_rule: "关联表同名字段统一别名: 关联表短前缀_字段名，例demo_info_price.id => price_id"
      # 修复2：弱化Preload配置，明确边缘场景，解决前后语义冲突
      preload_spec:
        table_source: "仅读取dal原生db模型TableName，不读取joins承接DTO"
        usage_limit: "仅前端一对一嵌套结构体返回使用，禁止一对多、分页、内外连接场景使用"
      joins_spec:
        sql_type: "统一单SQL db.Joins，不使用双SQL预加载"
        join_type: "LEFT JOIN/INNER JOIN直接通过Joins入参切换，无需额外兜底逻辑"
        dto_style: "优先使用嵌套子DTO（主表/关联表字段语义隔离），简单查询可使用字段平铺，禁止混用两种风格"
        one_to_many_rule: "一对多Joins查询仅允许 Distinct(`主表.主键`) 索引级去重，禁止.*、禁止裸Distinct"
    repo_extend:
      alias_standard: null
      mandatory_method:
        require_alias_field_method: false
        require_alias_gorm_model: false
        require_table_alias_method: false
      tx_spec:
        dal_reject_tx_param: true
        desc: "DAL层所有方法禁止接收tx入参，事务统一上层logic管控"
    where_spec:
      embed_rule: "统一指针内嵌*gormL.BaseWhere，禁止值内嵌"
      instance_rule: "禁止全局缓存where实例，每次查询通过Repo.GetWhere新建实例"
      coding_rule: "禁止结构体存储查询参数，统一链式方法返回自身"
      table_rule: "单表where可省略表名；joins/where无论是否join，全部强制携带原生表名"
    # 修复3：合并重复repo单例规则，删除冗余重复项
    forbidden_rules:
      - 禁止logic层反向依赖service上层模块
      - 禁止convert层编写任何业务逻辑
      - 禁止Repo全局单例，和repo.forbid_global_singleton双向对齐
      - 禁止手动new实例化Where结构体，必须通过Repo.GetWhere()获取
      - 禁止手写裸SQL，所有查询必须使用where链式构造器
      - 禁止跨层、反向非法依赖，严格遵守分层白名单
      - 禁止手动修改kitex_gen自动生成目录的代码
      - 禁止conf目录存放任何Go源码文件
      - 禁止硬编码业务常量、状态、时间等数据
  
  # 脚手架生成规范
  hz_scaffold:
    proto_mode: true
    forbid_manual_write_router: true
    forbid_manual_write_model: true
    update_by_proto_only: true
  
  # 全局红线禁止规则
  forbidden_rule:
    - "禁止logic层反向依赖handle上层模块，禁止循环依赖"
    - "禁止convert层编写任何业务判断、数据处理、流程逻辑"
    - "禁止handle层编写可复用重型通用业务逻辑，必须下沉logic"
    - "禁止手动new实例化Where结构体，必须通过Repo.GetWhere()获取"
    - "禁止手写裸SQL，全部使用where链式构造器查询"
    - "禁止Repo全局单例，每次使用必须新建实例"
    - "禁止conf目录存放Go源码文件，仅允许yaml配置"
    - "禁止手动修改router、model脚手架自动生成代码"
    - "禁止业务硬编码常量、状态、时间、ID等固定数据"
    - "禁止render目录层级混乱，必须严格两层结构：一级业务模块/二级子页面"

# 绑定当前使用的AI工具
tools:
  - name: "Qoder"
